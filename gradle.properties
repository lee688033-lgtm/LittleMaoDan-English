# 不要在这里加 -Dfile.encoding=UTF-8：Gradle 用守护进程的默认字符集写 JVM worker 的
# classpath @argfile，而 Windows 上的 java 启动器按系统 ANSI 代码页（此处 GBK）读它。
# 一旦守护进程是 UTF-8，中文项目路径在 argfile 里变成乱码，JVM 单测全部报
# ClassNotFoundException。Java 源码本身的编码在 app/build.gradle.kts 里单独指定。
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m
android.useAndroidX=true
kotlin.code.style=official

android.overridePathCheck=true
